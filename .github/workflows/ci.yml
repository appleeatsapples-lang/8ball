name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is in the list because `branches:` filters on the BASE branch,
    # and retargeting a PR fires `edited` — which is NOT in the default set
    # (opened/synchronize/reopened). Without it a retargeted PR draws no
    # checks at all, and an absent check is visually indistinguishable from a
    # pending one; PR #133 sat at zero checks until a close/reopen forced a
    # run (recorded in audits/L48_override_pr133_2026-07-29.md).
    #
    # NO `if:` guard narrows this to base-only edits, deliberately. Such a
    # guard would make the jobs report `skipped` on an ordinary title or body
    # edit, and a skipped job can satisfy a required status check — a gate
    # that stops gating while still looking green. That is the exact
    # false-green shape this workflow has already been bitten by twice (#126
    # F1, #129 F2). Redundant runs on a body edit are the cheaper failure:
    # they cost ~30s of runner time and are self-announcing.
    types: [opened, synchronize, reopened, edited]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # v5 is the lowest major of each action whose runtime is node24. v4
      # declares node20, which the runner now force-runs on node24 and warns
      # about. Pinned to v5 rather than latest so the runtime fix carries no
      # unrelated major-version behavior with it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      # Advisory coverage report (P9, journal 2026-07-29). Re-runs the suite
      # instrumented and prints the core/ + ui/ summary into the job log so
      # coverage movement is visible at review time. continue-on-error is
      # the "advisory" in code: no threshold exists, and even a coverage-tool
      # failure cannot redden a green suite — the `test` check's semantics
      # are exactly what they were before this step. Flooring a metric here
      # is an operator decision; do not add `thresholds` without one.
      - name: Coverage report (advisory, not a gate)
        continue-on-error: true
        run: npm run coverage
      - name: Verify single-file rule
        run: |
          lines=$(wc -l < index.html)
          echo "index.html: $lines lines"
          if [ "$lines" -gt 1500 ]; then
            echo "::error::index.html exceeds 1500 lines (DOCTRINE.md §6). Split into ui/ modules."
            exit 1
          fi
      - name: Doctrine/content changes require journal entry + audit artifact
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"
          # --no-renames is load-bearing. git enables rename detection by
          # default (diff.renames, since 2.9), and a detected rename prints
          # ONLY the destination path — the source silently leaves the list.
          # Without this flag `git mv content/cards.v1.full.js archive.md`
          # reads as a documentation change and this gate waves it through.
          # Same flag, same reason, on the l48 job's CHANGED= below.
          CHANGED=$(git diff --no-renames --name-only "$BASE"...HEAD)
          echo "Changed files in PR:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(DOCTRINE\.md|content/[^/]+\.js)$'; then
            if ! echo "$CHANGED" | grep -qE '^journal\.md$'; then
              echo "::error::PR touches DOCTRINE.md or content/*.js without touching journal.md (DOCTRINE.md §8)."
              exit 1
            fi
          fi
          echo "journal-touch gate: pass"
          if echo "$CHANGED" | grep -qE '^DOCTRINE\.md$'; then
            if ! echo "$CHANGED" | grep -qE '^audits/'; then
              echo "::error::PR touches DOCTRINE.md without a corresponding audit artifact under audits/ (DOCTRINE.md §8 gate 6 / §10 cross-model audit)."
              exit 1
            fi
          fi
          echo "audit-artifact gate: pass"

  # L48 is its own job so it reports a separately-requireable check
  # (`l48-gate`) and still evaluates when the suite is red. As a step inside
  # `test` it was unreachable whenever an earlier step exited non-zero, so a
  # failing suite hid whether the audit artifact was present. No `needs:` —
  # the independence is the point. No Node either: the gate is git plus grep.
  # The artifact predicate accepts ONLY the two documented shapes — the
  # verdict response or the explicit override. A brief, a renamed session
  # record, or any other audits/*pr<N>*.md file does not green the gate
  # (#126 audit F1 and #129 audit F2 were both false-greens under the old
  # any-audits-file predicate).
  l48:
    name: l48-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: L48 gate — PRs require an in-PR audit artifact
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"
          # --no-renames, and note it is the OPPOSITE of what ADDED= below
          # wants. Here we need the true file list: rename detection prints
          # only the destination, so `git mv tests/l48_gate.test.js
          # audits/archive.md` would make this PR look docs-only and exempt
          # itself from the gate — deleting this gate's own regression pins
          # with a green check and no artifact. ADDED= must KEEP rename/copy
          # detection, so that a recycled artifact is classified R/C and
          # dropped by --diff-filter=A. Two opposite settings, on purpose.
          CHANGED=$(git diff --no-renames --name-only "$BASE"...HEAD)
          if ! echo "$CHANGED" | grep -qvE '\.md$' \
             && ! echo "$CHANGED" | grep -qE '^(audits/RELEASE_CHECKLIST\.md|agents/.*\.md)$'; then
            echo "L48 gate: docs-only PR (no behavior, no governance-gate docs) — exempt"
            exit 0
          fi
          PR='${{ github.event.pull_request.number }}'
          # Only files ADDED by this PR can satisfy the gate. Renaming or
          # copying an artifact that already exists on the base branch
          # carries no new verdict; rename/copy detection classifies those as
          # R/C, which --diff-filter=A drops.
          #
          # Scope, so this is not read as more than it is: this does NOT close
          # #126's F1 on its own. There the rename was of a file created
          # earlier on the same branch, so against the merge base both paths
          # read as plain additions — the shape predicate is what rejects it.
          # This closes the adjacent dodge: recycling a previous PR's verdict.
          # Either way this stays a FILENAME gate. It proves a correctly-named
          # artifact was added, never that an independent review happened.
          ADDED=$(git diff --diff-filter=A --find-renames --find-copies-harder --name-only "$BASE"...HEAD)
          SHAPE="^audits/([a-z0-9_]+_pr${PR}_premerge_audit_[0-9]{4}-[0-9]{2}-[0-9]{2}_response|L48_override_pr${PR}_[0-9]{4}-[0-9]{2}-[0-9]{2})\.md$"
          ART=$(echo "$ADDED" | grep -E "$SHAPE" || true)
          if [ -n "$ART" ]; then
            echo "L48 gate: verdict/override artifact present — pass"
            echo "$ART"
          else
            # Distinguish the two failure modes rather than only restating
            # the rule: a correctly-named artifact that is present but not
            # added means it was renamed or copied into place.
            RECYCLED=$(echo "$CHANGED" | grep -E "$SHAPE" || true)
            if [ -n "$RECYCLED" ]; then
              echo "::error::L48: an artifact of the required shape is present but was NOT added by this PR — it was renamed or copied into place, and carries no independent verdict:"
              echo "$RECYCLED"
            fi
            echo "::error::PR without an in-PR L48 artifact of the required shape — a brief alone does not satisfy the gate. Commit the cross-model verdict response as audits/<model>_pr${PR}_premerge_audit_<date>_response.md, or an explicit override as audits/L48_override_pr${PR}_<date>.md — the override file IS the L48 sighting log."
            exit 1
          fi

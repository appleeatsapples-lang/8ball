name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # v5 is the lowest major of each action whose runtime is node24. v4
      # declares node20, which the runner now force-runs on node24 and warns
      # about. Pinned to v5 rather than latest so the runtime fix carries no
      # unrelated major-version behavior with it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      # Advisory coverage report (P9, journal 2026-07-29). Re-runs the suite
      # instrumented and prints the core/ + ui/ summary into the job log so
      # coverage movement is visible at review time. continue-on-error is
      # the "advisory" in code: no threshold exists, and even a coverage-tool
      # failure cannot redden a green suite — the `test` check's semantics
      # are exactly what they were before this step. Flooring a metric here
      # is an operator decision; do not add `thresholds` without one.
      - name: Coverage report (advisory, not a gate)
        continue-on-error: true
        run: npm run coverage
      - name: Verify single-file rule
        run: |
          lines=$(wc -l < index.html)
          echo "index.html: $lines lines"
          if [ "$lines" -gt 1500 ]; then
            echo "::error::index.html exceeds 1500 lines (DOCTRINE.md §6). Split into ui/ modules."
            exit 1
          fi
      - name: Doctrine/content changes require journal entry + audit artifact
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "Changed files in PR:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(DOCTRINE\.md|content/[^/]+\.js)$'; then
            if ! echo "$CHANGED" | grep -qE '^journal\.md$'; then
              echo "::error::PR touches DOCTRINE.md or content/*.js without touching journal.md (DOCTRINE.md §8)."
              exit 1
            fi
          fi
          echo "journal-touch gate: pass"
          if echo "$CHANGED" | grep -qE '^DOCTRINE\.md$'; then
            if ! echo "$CHANGED" | grep -qE '^audits/'; then
              echo "::error::PR touches DOCTRINE.md without a corresponding audit artifact under audits/ (DOCTRINE.md §8 gate 6 / §10 cross-model audit)."
              exit 1
            fi
          fi
          echo "audit-artifact gate: pass"

  # L48 is its own job so it reports a separately-requireable check
  # (`l48-gate`) and still evaluates when the suite is red. As a step inside
  # `test` it was unreachable whenever an earlier step exited non-zero, so a
  # failing suite hid whether the audit artifact was present. No `needs:` —
  # the independence is the point. No Node either: the gate is git plus grep.
  # The artifact predicate accepts ONLY the two documented shapes — the
  # verdict response or the explicit override. A brief, a renamed session
  # record, or any other audits/*pr<N>*.md file does not green the gate
  # (#126 audit F1 and #129 audit F2 were both false-greens under the old
  # any-audits-file predicate).
  l48:
    name: l48-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: L48 gate — PRs require an in-PR audit artifact
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          if ! echo "$CHANGED" | grep -qvE '\.md$' \
             && ! echo "$CHANGED" | grep -qE '^(audits/RELEASE_CHECKLIST\.md|agents/.*\.md)$'; then
            echo "L48 gate: docs-only PR (no behavior, no governance-gate docs) — exempt"
            exit 0
          fi
          PR='${{ github.event.pull_request.number }}'
          ART=$(echo "$CHANGED" | grep -E "^audits/([a-z0-9_]+_pr${PR}_premerge_audit_[0-9]{4}-[0-9]{2}-[0-9]{2}_response|L48_override_pr${PR}_[0-9]{4}-[0-9]{2}-[0-9]{2})\.md$" || true)
          if [ -n "$ART" ]; then
            echo "L48 gate: verdict/override artifact present — pass"
            echo "$ART"
          else
            echo "::error::PR without an in-PR L48 artifact of the required shape — a brief alone does not satisfy the gate. Commit the cross-model verdict response as audits/<model>_pr${PR}_premerge_audit_<date>_response.md, or an explicit override as audits/L48_override_pr${PR}_<date>.md — the override file IS the L48 sighting log."
            exit 1
          fi

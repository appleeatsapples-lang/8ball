[build]
  publish = "."
  # Deep-clean 2026-07-25 (PR-A): the ops layer (journal, doctrine, agent
  # manuals, audits/, tests/) is public in the repo but must not be served on
  # the product domain — publish = "." with a non-forced SPA rewrite serves
  # every tracked file. Netlify runs `command` inside its build copy before
  # publishing, so these deletions never touch the repo itself.
  # node_modules guard: adding any build command makes Netlify run npm
  # install first; delete the result so it can't ship under publish = ".".
  command = "rm -rf node_modules .netlify journal.md DOCTRINE.md CLAUDE.md AGENTS.md 8BALL.md PUBLIC_TIER_SPEC.md agents audits tests scripts .github vitest.config.js package.json package-lock.json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), gyroscope=()"
    # Report-only CSP (audit F4). Start in report-only so we can observe
    # violations before enforcing. 'unsafe-inline' is currently required
    # because several ui modules inject <style> tags at runtime; a later
    # pass can move those styles to static CSS or adopt hashes/nonces.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# assets/cities.json is 2.3MB and static per release; without a rule Netlify
# serves it max-age=0 must-revalidate. Seven-day cache is the headers-only
# half of audit M7 — bounded (not immutable) because the URL is unversioned,
# so a city-data correction can't go stale for more than a week (pre-merge
# audit P2, 2026-07-18). The versioned asset restores a 1-year immutable
# rule when the K1-gated index/shard work lands.
[[headers]]
  for = "/assets/cities.json"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Channel entry paths (DOCTRINE §4.B v0.56 sprint / §5 v0.35): first-party
# attribution read from the host's own server-side logs — no client event,
# no cookie, no query param, no redirect hop. Each path serves the app AT
# its own path (200 rewrite) so Netlify analytics counts it as a distinct
# page. Exact-match and non-forced: a real static file always wins, and
# /assets, /cards, /core, /ui, /content are untouched. Rules are evaluated
# top-to-bottom, so these must stay above the SPA catch-all.
# Validated by tests/channel_routes.test.js.
[[redirects]]
  from = "/r"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/x"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ig"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tt"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
